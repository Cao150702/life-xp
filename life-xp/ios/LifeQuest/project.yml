name: LifeQuest
options:
  bundleIdPrefix: com.lifequest
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  LifeQuest:
    type: application
    platform: iOS
    sources:
      - path: LifeQuest
        excludes:
          - "**/*.xcassets/AppIcon.appiconset"
    settings:
      base:
        INFOPLIST_GENERATION_DISABLED: YES
        INFOPLIST_FILE: LifeQuest/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.lifequest.app
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: MapKit.framework
      - sdk: UserNotifications.framework
      - package: Supabase
        product: Supabase
    info:
      path: LifeQuest/Info.plist
